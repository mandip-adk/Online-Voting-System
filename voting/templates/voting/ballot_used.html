{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Already Voted — {{ election.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/main.css' %}"/>
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;
             background:#F8F7FF;font-family:'Inter',sans-serif;padding:2rem 1rem;">

  <div style="max-width:480px;width:100%;background:white;border-radius:16px;padding:2.5rem;
              text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06);">

    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px;">
      <div style="width:36px;height:36px;background:var(--primary);border-radius:10px 10px 10px 0;
                  display:flex;align-items:center;justify-content:center;">
        <span style="color:white;font-weight:900;font-style:italic;font-size:1rem;">i</span>
      </div>
      <span style="font-size:1.4rem;font-weight:900;color:var(--navy);">
        <em style="font-style:normal;color:var(--primary);">i</em>VOTE
      </span>
    </div>

    <div style="width:72px;height:72px;background:rgba(245,158,11,.1);border-radius:50%;
                display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
      <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="#F59E0B" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874
             1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
      </svg>
    </div>

    <h1 style="font-size:1.4rem;font-weight:800;color:var(--navy);margin-bottom:.5rem;">
      You have already voted
    </h1>
    <p style="color:#6b7280;font-size:.9rem;margin-bottom:1.5rem;">
      {{ election.title }}
    </p>

    <div style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:14px;">
      <p style="color:#6b7280;font-size:.8rem;margin:0;">
        This voting link has already been used. Each link can only be used once.
      </p>
    </div>

  </div>

</body>
</html>
