{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vote Receipt — {{ election.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/main.css' %}"/>
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;
             background:#F8F7FF;font-family:'Inter',sans-serif;padding:2rem 1rem;">

  <div style="max-width:480px;width:100%;background:white;border-radius:16px;padding:2.5rem;
              text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06);">

    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px;">
      <div style="width:36px;height:36px;background:var(--primary);border-radius:10px 10px 10px 0;
                  display:flex;align-items:center;justify-content:center;">
        <span style="color:white;font-weight:900;font-style:italic;font-size:1rem;">i</span>
      </div>
      <span style="font-size:1.4rem;font-weight:900;color:var(--navy);">
        <em style="font-style:normal;color:var(--primary);">i</em>VOTE
      </span>
    </div>

    <div style="width:72px;height:72px;background:rgba(22,163,74,.1);border-radius:50%;
                display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
      <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="#16A34A" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
    </div>

    <h1 style="font-size:1.4rem;font-weight:800;color:var(--navy);margin-bottom:.5rem;">
      Thank you for voting!
    </h1>
    <p style="color:#6b7280;font-size:.9rem;margin-bottom:.25rem;">
      {{ election.title }}
    </p>
    <p style="color:#9ca3af;font-size:.8rem;margin-bottom:1.5rem;">
      Voted at {{ roll.used_at }}
    </p>

    <div style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:14px;">
      <p style="color:#6b7280;font-size:.8rem;margin:0;">
        Your vote has been recorded anonymously. It is not possible to link your vote back to you.
      </p>
    </div>

  </div>

</body>
</html>
